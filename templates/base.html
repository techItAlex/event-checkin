<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ event_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar"><div class="inner">
    <a class="brand" href="{{ url_for('register') }}">🎟 {{ event_name }}</a>
    <nav>
      <a href="{{ url_for('register') }}" class="{{ 'active' if request.endpoint == 'register' }}">Register</a>
      <a href="{{ url_for('checkin_page') }}" class="{{ 'active' if request.endpoint == 'checkin_page' }}">Check-in</a>
      <a href="{{ url_for('attendees') }}" class="{{ 'active' if request.endpoint == 'attendees' }}">Attendees</a>
      {% if session.get('staff') %}<a href="{{ url_for('logout') }}">Log out</a>{% endif %}
    </nav>
  </div></header>
  <main class="{% block mainclass %}card{% endblock %}">
    {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
    {% block body %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
