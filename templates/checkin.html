{% extends "base.html" %}
{% block mainclass %}card wide{% endblock %}
{% block body %}
<h1>Check-in</h1>
<p class="muted">Scan the QR with the camera, or type / paste the ticket code and press Enter.</p>
<div id="reader"></div>
<input id="manual" placeholder="Ticket code, then Enter" autocomplete="off" autofocus>
<div id="result" class="result idle">Waiting for scan…</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='checkin.js') }}"></script>
{% endblock %}
