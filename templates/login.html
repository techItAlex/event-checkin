{% extends "base.html" %}
{% block body %}
<h1>Staff login</h1>
<p class="muted">Enter the staff PIN to continue.</p>
<form class="stack" method="post">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Staff PIN
    <input name="pin" type="password" inputmode="numeric" required autofocus>
    {% if error %}<span class="err">{{ error }}</span>{% endif %}
  </label>
  <button type="submit">Enter</button>
</form>
{% endblock %}
